name: تست و استقرار

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: نصب (بدون تلگرام؛ تست‌ها از stub استفاده می‌کنند)
        run: pip install openpyxl python-docx cryptography python-dotenv
      - run: python -m py_compile bot/*.py
      - run: python tests/test_bot.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: استقرار روی سرور از طریق SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd ~/adineh-bot
            git fetch origin main && git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
